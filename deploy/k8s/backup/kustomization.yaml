apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The scheduled backup workload, separate from the base on purpose: it needs a
# volume and a database, and a deployment that has neither should not get a
# CronJob that fails every fifteen minutes. Enable it with
#   kubectl apply -k deploy/k8s/backup
# after the base is up and `re0auth-secrets` carries `database-url`.
namespace: re0auth
resources:
  - pvc.yaml
  - cronjob.yaml
