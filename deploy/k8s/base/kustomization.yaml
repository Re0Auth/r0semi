apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: re0auth
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
# Pin a released tag or, better, a digest:
#   kustomize edit set image ghcr.io/re0auth/r0semi=ghcr.io/re0auth/r0semi@sha256:...
#
# The tag below is the most recent published release, not `latest`: a floating
# reference means a redeploy silently picks up whatever was pushed last, which is
# the opposite of what a baseline is for.
#
# `internal/archtest` holds two halves of that claim. It refuses `latest` (and an
# empty tag), and it refuses a tag this repository does not have: the release
# workflow publishes one image per `v*` tag, so a name that is not a tag here
# names an image nobody pushed. Both used to be one check on the string alone,
# which passed for a tag that had never been built.
images:
  - name: ghcr.io/re0auth/r0semi
    newTag: v0.0.0-rc.3
