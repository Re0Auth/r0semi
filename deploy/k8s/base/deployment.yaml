apiVersion: apps/v1
kind: Deployment
metadata:
  name: re0auth
  namespace: re0auth
  labels: { app.kubernetes.io/name: re0auth }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: re0auth }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app.kubernetes.io/name: re0auth }
    spec:
      serviceAccountName: re0auth
      # Longer than the server's own shutdown: it flips /readyz to 503 and waits
      # out the endpoint removal (5s), then drains in-flight requests (30s) — 35s
      # total. 45s means the pod outlives the requests it is finishing instead of
      # being killed mid-shutdown. The endpoint-removal wait is in the process, not
      # a preStop hook: the scratch image has no /bin/sleep to run one with.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: re0auth }
      containers:
        - name: re0auth
          # Pinned to the released tag, kept in step with kustomization.yaml's
          # newTag. NOT `latest`: a floating tag here means `kubectl apply` of the
          # base (without kustomize's override) deploys whatever was pushed last,
          # which is exactly what a pinned baseline is meant to prevent.
          image: ghcr.io/re0auth/r0semi:v0.0.0-rc.3
          imagePullPolicy: IfNotPresent
          args: ["-config=/etc/re0auth/re0auth.toml"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: internal, containerPort: 9090 }
          env:
            # The Go heap's soft limit, set below the container's hard one on
            # purpose. The container limit is enforced by the kernel with a SIGKILL
            # and no unwinding: the process never learns it is about to die, so
            # every request in flight is lost rather than refused. GOMEMLIMIT makes
            # the collector work harder as the heap approaches it, which turns
            # "about to be killed" into "slower and then shedding" (the data plane
            # sheds on its own byte budget — see max_upstream_buffer_bytes in the
            # ConfigMap). 384MiB leaves the runtime, the connection pool and the
            # audit buffers room under the 512Mi limit below.
            - name: GOMEMLIMIT
              value: "384MiB"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: re0auth-secrets, key: database-url }
            - name: RE0AUTH_KEK
              valueFrom:
                secretKeyRef: { name: re0auth-secrets, key: kek }
            - name: RE0AUTH_OIDC_TOKEN_KEY
              valueFrom:
                secretKeyRef: { name: re0auth-secrets, key: oidc-token-key }
            - name: RE0AUTH_OIDC_SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: re0auth-secrets, key: oidc-signing-key }
            - name: RE0AUTH_AUDIT_KEY
              valueFrom:
                secretKeyRef: { name: re0auth-secrets, key: audit-key }
          volumeMounts:
            - { name: config, mountPath: /etc/re0auth, readOnly: true }
          # Startup is not a request. Migrations run before the listener binds
          # (cmd/re0auth), and a second replica waits on the migration advisory
          # lock for as long as the first one takes — so a slow migration is a
          # legitimate reason for /healthz to be unreachable for a while. Without
          # this probe liveness (3 × 10s) would kill the pod mid-migration and the
          # deployment would crash-loop; with it, startup gets 24 × 5s = 120s and
          # liveness only begins counting once startup has succeeded.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # requests/limits are not optional: a container without them can take
          # the node's memory with it and get every co-tenant evicted.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: re0auth-config }
