apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: re0auth
  namespace: re0auth
  annotations:
    # TLS terminates here; the issuer is https and the app is configured with
    # cookie_secure = true for the same reason.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    # The server drains for up to 30s; the proxy must wait for it, not cut it off.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [auth.example.com]
      secretName: re0auth-tls
  rules:
    - host: auth.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: re0auth
                port: { name: http }

# The secret above is the deployment's to create. This base deliberately does not
# create it: shipping a Certificate would make cert-manager a hard requirement of
# applying the baseline, and an operator who uses another issuer would have to
# delete it before starting. With cert-manager installed, apply this:
#
# apiVersion: cert-manager.io/v1
# kind: Certificate
# metadata:
#   name: re0auth-tls
#   namespace: re0auth
# spec:
#   secretName: re0auth-tls
#   dnsNames: [auth.example.com]
#   issuerRef:
#     name: letsencrypt
#     kind: ClusterIssuer
#
# Whichever way it is issued, docs/operations.md must keep naming it: a prerequisite
# an operator cannot find is a dangling one, and internal/archtest checks that it is
# named there.
