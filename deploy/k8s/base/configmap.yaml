apiVersion: v1
kind: ConfigMap
metadata:
  name: re0auth-config
  namespace: re0auth
data:
  # Structure only. Every secret is named by env var and supplied through
  # re0auth-secrets, so this object can be committed and reviewed.
  re0auth.toml: |
    [server]
    issuer        = "https://auth.example.com"
    addr          = "0.0.0.0:8080"
    internal_addr = "0.0.0.0:9090"
    # The pod has to bind 0.0.0.0 for the Service to select it, so the
    # operational surface is reachable from outside the pod — which the process
    # refuses without this acknowledgement. What makes it safe is the
    # NetworkPolicy beside this file: ingress to 9090 is allowed only from the
    # `monitoring` namespace. On any other orchestrator, provide that control
    # yourself or bind a loopback address.
    expose_internal = true
    cookie_secure = true
    rate_limit       = 50
    rate_limit_burst = 100
    # max_in_flight is deliberately NOT set here. This manifest runs postgres, so
    # the cap is derived from the connection pool (max(64, max_conns x 8) = 128
    # with the default pool of 16 — see docs/capacity-planning.md §4). Writing 512
    # here, as this file used to, contradicted the derivation the code applies and
    # the ambient 512 the in-memory mode keeps, and 512 concurrent requests each
    # holding a 4 MiB upstream body is 2 GiB against this pod's 512Mi limit.
    #
    # The data plane's own bound is the byte budget below: it is what actually
    # caps "in flight x body size", because every other endpoint holds hundreds of
    # bytes per request.
    max_upstream_buffer_bytes = 67108864 # 64 MiB: a quarter of the 512Mi limit
    # The ingress (see ingress.yaml) is the nearest proxy. Ingress-nginx appends
    # the address it saw to X-Forwarded-For, and the guard in
    # internal/zzprobe/deploy/artifacts_test.go keeps it from being told to trust an
    # incoming X-Forwarded-For (`use-forwarded-headers` / `forwarded-for-header` are
    # refused there) — so the rightmost entry is the real client and per-client
    # buckets are correct. A proxy that forwards the caller's own header verbatim
    # would make the bucket key caller-chosen; declaring the header is this
    # deployment's assertion that its ingress does not.
    client_addr_header = "x-forwarded-for"
    trusted_proxies    = ["10.0.0.0/8"]

    [storage]
    driver  = "postgres"
    dsn_env = "DATABASE_URL"

    [vault]
    kek_env = "RE0AUTH_KEK"
    kek_id  = "kek-1"

    [admin]
    subjects = []
