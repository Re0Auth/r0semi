name: release

# Tag-only, on purpose. A downloadable binary is a claim that a commit is worth
# running, and that claim should be made deliberately: pushing to main runs
# ci.yml and publishes nothing.
on:
  push:
    tags: ['v*']

# gh release create writes a release. id-token is what keyless signing exchanges
# for a short-lived certificate from Fulcio: there is no signing key to store,
# leak or rotate, and the certificate records which workflow produced the
# artifact — something a bare checksum cannot say.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    # The Go suite refuses to *skip* the Postgres tests when CI is set
    # (openTestDB fails instead of skipping), so the gate below needs a real
    # server — the same one ci.yml uses.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r0semi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/r0semi_test?sslmode=disable

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # pnpm before setup-node, because the node step's `cache: pnpm` needs pnpm
      # on PATH to find the store. Same version as web/package.json's
      # packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # First, and through the Makefile target rather than by hand, so the order
      # cannot be got wrong: the binaries embed internal/webui/dist, and `make web`
      # is what asserts the embed is the real app rather than the placeholder.
      - name: build the frontend
        run: make web

      # A tag normally points at a commit that already passed ci.yml. "Normally"
      # is not "always" — a tag can be pushed at a commit that never saw a pull
      # request — so the gate re-runs the suite here rather than trusting the
      # tag. It runs with the race detector, like ci.yml: a data race is not
      # something to discover in a released binary, and the Postgres service this
      # job already starts is what the race detector needs to exercise the
      # durable paths too. The cost is minutes at tag time; the alternative is a
      # published artifact whose only concurrency evidence is a run that did not
      # check for it.
      - name: gate
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -race -p 1 -timeout 300s ./...

      # The SBOM generator `make release` shells out to. Pinned here and in the
      # Makefile, so what a release publishes cannot change because an upstream tag
      # moved.
      - name: install the SBOM generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0

      # The version comes from the tag rather than from `git describe`, so the
      # artifact and the release agree even in a shallow clone. The target re-runs
      # the frontend step (idempotent, a few seconds): keeping the dependency is
      # what makes the ordering a guarantee instead of a step order somebody can
      # rearrange. It also produces the SBOM and checksums that cover both.
      - name: package
        run: make release VERSION="${{ github.ref_name }}"

      # Keyless signing: the signature's identity is this workflow, attested by
      # GitHub's OIDC provider and recorded in the transparency log. Nothing to
      # store, nothing to rotate.
      #
      # It signs SHA256SUMS rather than each file. The checksums already bind every
      # archive and the SBOM, so one signature covers the whole release — and
      # because the set of files is fixed before the signature is made, nothing can
      # be added afterwards without the checksums no longer matching.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: sign the checksums
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag carrying a pre-release suffix (v1.2.3-rc.1, -beta.2, …) is marked
          # as one. Without this an rc would land as the repository's latest
          # release, which is the same kind of over-claim the README's warning
          # exists to avoid — and the tag most likely to carry such a suffix is the
          # one cut to validate this very pipeline.
          #
          # The tag comes from GITHUB_REF_NAME rather than an interpolated
          # expression, so a tag with shell metacharacters cannot become code.
          case "${GITHUB_REF_NAME}" in
            *-*) pre="--prerelease" ;;
            *)   pre="" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            $pre \
            --generate-notes
