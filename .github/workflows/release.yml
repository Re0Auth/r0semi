name: release

# Tag-only, on purpose. A downloadable binary is a claim that a commit is worth
# running, and that claim should be made deliberately: pushing to main runs
# ci.yml and publishes nothing.
on:
  push:
    tags: ['v*']

# gh release create writes a release; packages:write pushes the image to GHCR;
# id-token is what keyless signing exchanges for a short-lived certificate from
# Fulcio, and what buildx uses for provenance.
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # The tag gate is not a hand-picked subset. It is ci.yml itself, called as a
  # reusable workflow, so a release cannot run with a check that CI has but this
  # file forgot to copy. Whatever turns main red turns a tag red.
  ci:
    uses: ./.github/workflows/ci.yml

  # A runnable image is part of a release, not a side effect of one: amd64 and
  # arm64, an SBOM and provenance attestation, a signed digest, and a scan that
  # fails the job on HIGH/CRITICAL vulnerabilities.
  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance and SBOM are attached to the pushed manifest, so the
          # digest carries the build's own account of how it was made.
          provenance: true
          sbom: true

      # An OCI reference is lowercase in its repository part, and this
      # organization's name is not. Handing `ghcr.io/Re0Auth/r0semi@sha256:…`
      # straight to Trivy fails with "could not parse reference" — the build and
      # push tools normalize the name on the way out, this parser does not. That is
      # what failed the first tag run, after the DB and the image had both been
      # fetched successfully; the same string went to the two steps below.
      #
      # One step computes the name, the scan and the signature read it, so the
      # three cannot drift apart.
      - name: image reference
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Trivy is pinned by digest too: a scanner that can change under its tag is
      # the same supply-chain problem the pinning below exists to avoid. The
      # runtime image is scratch, so there is no OS package surface — this scan
      # is about the Go binary's dependency graph and whatever the base stages
      # left behind.
      - name: scan the image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker/config.json":/root/.docker/config.json:ro \
            aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
            image --exit-code 1 --severity HIGH,CRITICAL --no-progress \
            "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: sign the image digest
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"

  release:
    needs: [ci, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # pnpm before setup-node, because the node step's `cache: pnpm` needs pnpm
      # on PATH to find the store. Same version as web/package.json's
      # packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # First, and through the Makefile target rather than by hand, so the order
      # cannot be got wrong: the binaries embed internal/webui/dist, and `make web`
      # is what asserts the embed is the real app rather than the placeholder.
      - name: build the frontend
        run: make web

      # The SBOM generator `make release` shells out to. Pinned here and in the
      # Makefile, so what a release publishes cannot change because an upstream tag
      # moved.
      - name: install the SBOM generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0

      # The version comes from the tag rather than from `git describe`, so the
      # artifact and the release agree even in a shallow clone. The target re-runs
      # the frontend step (idempotent, a few seconds): keeping the dependency is
      # what makes the ordering a guarantee instead of a step order somebody can
      # rearrange. It also produces the SBOM and checksums that cover both.
      - name: package
        run: make release VERSION="${{ github.ref_name }}"

      # Keyless signing: the signature's identity is this workflow, attested by
      # GitHub's OIDC provider and recorded in the transparency log. Nothing to
      # store, nothing to rotate.
      #
      # It signs SHA256SUMS rather than each file. The checksums already bind every
      # archive and the SBOM, so one signature covers the whole release — and
      # because the set of files is fixed before the signature is made, nothing can
      # be added afterwards without the checksums no longer matching.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: sign the checksums
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag carrying a pre-release suffix (v1.2.3-rc.1, -beta.2, …) is marked
          # as one. Without this an rc would land as the repository's latest
          # release, which is the same kind of over-claim the README's warning
          # exists to avoid — and the tag most likely to carry such a suffix is the
          # one cut to validate this very pipeline.
          #
          # The tag comes from GITHUB_REF_NAME rather than an interpolated
          # expression, so a tag with shell metacharacters cannot become code.
          case "${GITHUB_REF_NAME}" in
            *-*) pre="--prerelease" ;;
            *)   pre="" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            $pre \
            --generate-notes
