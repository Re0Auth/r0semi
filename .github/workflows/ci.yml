name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Reusable so the tag-time release gate runs exactly this workflow instead of a
  # hand-maintained subset of it. A release that skipped a job here would be a
  # published binary whose checks never ran.
  workflow_call:

permissions:
  contents: read

# Every `uses:` below is pinned to a full commit SHA, with the human-readable
# release in a trailing comment. A floating `@v4` is a version of somebody else's
# code that can change without a commit here — and these actions run with this
# repository's token, inside the job that holds the Postgres service and the
# release secrets. The toolchain is already pinned for the same reason
# (govulncheck, golangci-lint, gitleaks, the SBOM generator); a workflow is the
# one place where "unpinned" means "executing arbitrary new code in CI".
#
# To move a pin: bump the SHA and the comment together. `git ls-remote <repo>
# 'refs/tags/<tag>^{}'` gives the commit a tag points at.
jobs:
  test:
    # The authoritative run. Unit tests use the in-memory stores and pass on any
    # platform; the Postgres integration tests only run here, against a real
    # server, so "it worked on my machine" is never the evidence.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r0semi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/r0semi_test?sslmode=disable
      # The floor enforced below. It is set below what the suite reaches with the
      # Postgres tests *skipped* (measured locally: 66.0%), so both a laptop without
      # a database and this job clear it; the job's own figure is higher, because the
      # Postgres tests execute here. Raise it when the real number rises. Never lower
      # it to turn a red build green — a floor that moves to meet the code is not a
      # floor.
      COVERAGE_FLOOR: '62'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # pnpm before setup-node: the node step's `cache: pnpm` needs pnpm on PATH
      # to locate the store, and the version is pinned to the one in
      # web/package.json's packageManager field so CI and a laptop resolve the
      # same dependency tree.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Before the Go steps, because internal/webui embeds the result. Without
      # this, every Go test still passes — against the placeholder, which is
      # exactly the kind of silent skip this pipeline exists to refuse.
      - name: build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          # The placeholder keeps the embed compiling on a machine with no Node;
          # it does not contain index.html. Its presence is therefore proof that
          # a real build happened and got embedded.
          test -f ../internal/webui/dist/index.html || {
            echo "the frontend did not build; the embedded app is the placeholder"
            exit 1
          }

      # svelte-check (types + accessibility) is the frontend's static analysis,
      # and `make check` has always run it — but CI never did, so it was a check
      # nobody was held to. docs/dependencies.md is explicit that "a check not in
      # CI is not a check", and this is the one that was missing. It needs the
      # dependencies from the step above; it does not need the build.
      - name: frontend check (svelte-check)
        working-directory: web
        run: pnpm run check

      # The SPA is embedded in every binary and image, so its weight is paid by
      # every deployment, and nothing else in the build notices when it grows.
      # It runs here, right after the build, because the script refuses to measure
      # the placeholder — a budget that passes on an empty directory is worse than
      # no budget.
      - name: bundle budget
        working-directory: web
        run: pnpm run check:bundle

      - name: cache playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The dependency firewall, as its own gate rather than a line buried in the
      # suite: public libraries must not reach into internal/, and the database
      # adapter must not leak into the domain. See internal/archtest.
      - name: dependency direction
        run: go test ./internal/archtest/ -v

      # Runs everything; the Postgres tests run because TEST_DATABASE_URL is
      # set at the job level. Without it they skip (that is how local
      # development works), and the CI guard in openTestDB turns that into a
      # failure rather than a silent pass.
      #
      # Coverage is measured on this run rather than a second one: -race implies
      # -covermode=atomic, so the profile costs a little time and no extra pass
      # over the suite. A profile that is not actually produced here — the flags
      # silently disagreeing, say — would be caught by the floor step below
      # reading an empty total, which is why the total is echoed before it is
      # checked.
      #
      # -p 1 serializes packages because three of them (store/postgres, oidchttp,
      # httpapi) share one database; run in parallel, one package's TRUNCATE can
      # wipe rows another is using mid-test.
      - name: go test
        run: |
          go test -race -p 1 -timeout 300s \
            -covermode=atomic -coverprofile=coverage.out \
            ./...
          go tool cover -func=coverage.out | tail -1

      # The floor. A coverage number that is only printed is a number nobody is
      # held to; a package can rot to zero statements executed and every other
      # gate here stays green. This is deliberately a *floor* and not a target:
      # it is set below the current figure so it fires on a real regression and
      # not on the normal ebb of a refactor.
      - name: coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total statement coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          if awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(t + 0 >= f + 0) }'; then
            echo "coverage ${total}% meets the floor"
          else
            echo "::error::coverage ${total}% is below the floor of ${COVERAGE_FLOOR}%"
            exit 1
          fi

      # The floor is enforced above; this makes the number *readable*. Without a
      # service like Codecov, per-package coverage is invisible in a review, and a
      # package that barely clears the floor looks exactly like one at 90%. The
      # table goes to the job summary, lowest first, and `make cover` produces it
      # from the same tool, so the two cannot drift.
      - name: coverage summary
        run: |
          go run ./cmd/covertable coverage.out | tee coverage-table.txt
          {
            echo 'Per-package statement coverage, lowest first:'
            echo '```'
            cat coverage-table.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Verbose, so the log proves each integration test executed rather than
      # skipped: the package summary reads "ok" in both cases.
      - name: postgres integration tests (verbose)
        run: go test -race -v -timeout 120s ./internal/store/postgres/

      # The same guarantee for the one Postgres-backed test outside that package.
      # It skips when TEST_DATABASE_URL is unset — the Windows runner cannot have a
      # service container, so "CI" cannot mean "a database exists" — and this step
      # is what keeps that from turning into a silent skip: a SKIP prints in the
      # verbose output and the grep below fails, so neither skipping here nor
      # deleting the test can pass unnoticed.
      - name: postgres-backed httpapi wiring test (verbose)
        run: |
          go test -race -v -timeout 120s -run TestOIDCWiringEndToEnd ./internal/httpapi/ > wiring.txt
          cat wiring.txt
          grep -q -- '--- PASS: TestOIDCWiringEndToEnd' wiring.txt

      - name: build
        run: go build ./...

      # Last, because it is the slowest and the most end-to-end: it builds its own
      # re0auth, starts a fake identity provider, and drives a real browser
      # through the consent and device flows. What it catches that nothing else
      # can is the class of bug where every layer is individually correct and the
      # assembled page still does not work — a CSP that blocks the app's own
      # bootstrap, for instance, which is invisible to a header assertion.
      #
      # Twice: once with the in-memory OP store, once with Postgres
      # (E2E_DATABASE_URL points re0auth at the job's Postgres). The engine is the
      # same OpenID Provider in both; E2E_DATABASE_URL only moves where its state
      # lives, so the Postgres store is not the one that is never exercised.
      - name: browser tests (in-memory store)
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e

      # The visual set is not in this run (`--grep-invert @visual`, inside the
      # script): a visual test with no baseline for this platform fails by
      # definition, and the Linux baselines do not exist yet. Once the
      # `visual-baselines` workflow's artifact is committed, adding a
      # `pnpm run test:visual` step here makes them a gate — the second of the two
      # steps in web/README.md.
      - name: browser tests (Postgres store)
        working-directory: web
        run: E2E_DATABASE_URL="$TEST_DATABASE_URL" pnpm run test:e2e

  windows-smoke:
    # The release ships windows/amd64 binaries, but until this job no test ever
    # ran on Windows: path handling, signal delivery and the build itself are what
    # differ. It is a smoke gate, not the authoritative run — the full suite with
    # Postgres stays in the `test` job.
    #
    # The Postgres integration tests are excluded because GitHub runs container
    # `services:` only on Linux, and the CI guard in openTestDB
    # (internal/store/postgres) turns a missing TEST_DATABASE_URL into a failure
    # rather than a silent skip — so a naive `go test ./...` here would fail on a
    # package that genuinely cannot run. The one Postgres-backed test outside that
    # package (internal/httpapi's wiring test) skips on the same missing DSN for
    # the same reason; the Linux job asserts by name that it ran.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # bash, so the gofmt check is byte-for-byte the Linux one.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (excluding the Postgres adapter)
        shell: pwsh
        run: |
          $pkgs = go list ./... | Where-Object { $_ -notmatch 'internal/store/postgres' }
          go test $pkgs

  supply-chain:
    # Known vulnerabilities reachable from this code, and the SBOM. Neither needs
    # Postgres or Node — both are facts about the module graph — so this is its own
    # job, where a failure reads as "supply chain" rather than as one line buried
    # in the test log.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The frontend has its own lockfile and its own advisories; govulncheck only
      # sees Go modules. pnpm audit is the equivalent gate on that side.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
      # No `cache: pnpm` here, deliberately: this job audits the lockfile and never
      # installs, so the store setup-node would save is never created, and its post
      # step fails the job when the save finds no such path — a cache *hit* skips
      # the save, so that stays invisible until the cache is cold (a new repository,
      # or any lockfile change that moves the key). archtest's workflow guard makes
      # the rule a check rather than this comment.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: audit frontend dependencies
        working-directory: web
        run: pnpm audit --audit-level high

      # Vulnerabilities in the dependency graph that are actually reachable from
      # this code, which is what govulncheck's call-graph analysis answers and a
      # plain version comparison cannot.
      #
      # The tool is pinned. An unpinned scanner turns a green build red on someone
      # else's release schedule, and a gate that fails for reasons unrelated to the
      # change is a gate that gets deleted. The vulnerability database it reads is
      # always current; only the tool is fixed.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      # The SBOM is generated here as well as at release time, so the release is
      # not the first place it is ever run — a broken generator should fail a pull
      # request, not a tag.
      #
      # The component count is an anti-vacuous floor, in the same spirit as the
      # route walks in internal/httpapi: an SBOM with no components is a valid
      # CycloneDX document and would pass every other check there is.
      - name: sbom
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod mod -json -output sbom.cdx.json
          components=$(grep -c '"type": "library"' sbom.cdx.json)
          echo "sbom components: $components"
          test "$components" -gt 10

  bench:
    # The capacity benchmarks are compiled and executed on every change, so one
    # that stopped running — a renamed helper, a fixture that no longer compiles
    # — fails here instead of being discovered when somebody asks for a number.
    #
    # The figures are reported, not thresholded. A benchmark gate that fails on a
    # slow or busy runner is a gate people delete, and a number that people
    # delete the gate to avoid is worse than no number. The floor is only that
    # results were produced at all, which is the anti-vacuous check: an empty
    # benchmark set passes every other gate there is.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: benchmarks
        run: |
          # -benchtime=200x keeps the job quick; the per-op figures are stable
          # enough at that count to compare by eye, and the loop count is not
          # what this gate is about.
          go test -run '^$' -bench . -benchmem -benchtime=200x ./... | tee bench.txt
          results=$(grep -c 'ns/op' bench.txt || true)
          echo "benchmark results: $results"
          if [ "$results" -lt 3 ]; then
            echo "::error::expected at least 3 benchmark results, got $results"
            exit 1
          fi

  load:
    # The capacity profile: concurrent load against a real HTTP server on the
    # in-memory stores, reporting throughput and the latency tail. It runs on every
    # change for the same reason `bench` does — a harness that quietly stopped
    # running should fail here, not be discovered when somebody asks for a number.
    #
    # The figures are reported rather than thresholded, like `bench`. The harness
    # itself fails when it completed no work, so a green job means numbers exist,
    # and it appends its table to the job summary so the numbers are readable in
    # the CI UI without opening the log.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: capacity profile
        run: make load

  fuzz:
    # A short, time-boxed fuzz pass on EVERY target in the repo: the parsers that
    # read attacker-influenced bytes — the raw-path join, protocol response parsing,
    # discovery-document handling, the PKCE value, the redirect builder, the JSONP
    # unwrapper. The seed corpus also runs under the ordinary `go test` job; this job
    # is the one that explores beyond it, which is what finds the input nobody
    # imagined. A crash it finds is reproduced from the corpus and then pinned as a
    # normal test.
    #
    # It lists every target rather than a sample. Two targets used to be here while
    # eight others existed, and a target that only ever sees its seed corpus never
    # explores anything — the gate said "the parsers" and covered the two.
    #
    # Time-boxed so the gate stays cheap. It lands on the release gate too
    # (release.yml calls this workflow): a published binary should not be the
    # first artifact built from parsers that were never fuzzed beyond their seeds.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # One `go test -fuzz` per target: the tool fuzzes exactly one at a time. The
      # loop is `set -e`, so a target that was renamed or deleted fails the job
      # instead of quietly dropping out of the gate — which is how the eight above
      # came to be missing in the first place.
      - name: fuzz every target
        run: |
          set -euo pipefail
          while IFS=: read -r pkg target; do
            echo "::group::fuzz ${target} (${pkg})"
            go test -fuzz="${target}" -fuzztime=20s "${pkg}"
            echo "::endgroup::"
          done <<'TARGETS'
          ./idp:FuzzStripJSONP
          ./oauth:FuzzBuildRedirect
          ./internal/federation:FuzzCleanRawPath
          ./internal/federation:FuzzRejectEscapingPath
          ./internal/federation:FuzzValidateRawBase
          ./internal/oidchttp:FuzzTokenErrorCode
          ./internal/oidchttp:FuzzIsOAuthErrorBody
          ./internal/oidchttp:FuzzStripUnsupportedDiscoveryFields
          ./internal/oidchttp:FuzzValidPKCEValue
          ./internal/oidchttp:FuzzDuplicatedParam
          TARGETS

  lint:
    # Static analysis as its own gate. It needs no Postgres, no Node and no
    # frontend build, so it is the fastest job to fail and it says exactly one
    # thing when it does.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source and pinned, like govulncheck. The version is fixed
      # rather than floating on @latest: an unpinned linter turns a green build
      # red on someone else's release schedule, and a gate that fails for reasons
      # unrelated to the change is a gate people delete. Configuration, and the
      # reasoning for the rules it enables, is in .golangci.yml.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m ./...

  secrets:
    # A credential committed to a public repository is a credential to rotate, so
    # this runs on every change rather than only at release. It scans the whole
    # history, not just the diff, because a secret added yesterday and removed
    # today is still in the repository.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 0: the full history. A shallow clone would scan only the tip and miss
          # exactly the case this job exists for.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source and pinned. The module path is github.com/zricethezav/…
      # rather than the canonical github.com/gitleaks/…: every released tag up to
      # 8.30.1 still declares the old path in its go.mod, so the new path cannot
      # be installed. The pinned tag is what matters; the path is an artifact of
      # the project's rename. Configuration is in .gitleaks.toml.
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" detect --source . --redact --verbose --config .gitleaks.toml

  image:
    # The container image is a shipped artifact like the release archives, so it
    # is built on every change rather than only at a tag: a Dockerfile that has
    # never been built is a Dockerfile that does not work. The build is the
    # assertion — a placeholder frontend or a missing embed would fail it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: re0auth:ci
          build-args: |
            VERSION=ci
