# golangci-lint configuration.
#
# The gate is deliberately narrow and stable: the standard analyzer set plus a
# few checks that catch mistakes this codebase is specifically exposed to
# (leaked HTTP response bodies and error comparisons against sentinels). A
# linter that turns a green build red on style drift is a linter people learn to
# route around; every rule here is one a reviewer would raise anyway.
#
# `gofmt` is not configured here: it runs as its own step in CI and in
# `make check`, so the two never disagree about formatting.
version: "2"

run:
  timeout: 5m

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused. It is the set
  # `golangci-lint run` enables with no configuration, so a developer running it
  # by hand sees what CI sees.
  default: standard
  enable:
    # bodyclose catches an http.Response whose Body is never closed, which leaks
    # a connection from the shared pool. This service is a proxy with outbound
    # clients, so it is a real hazard rather than a hypothetical one.
    - bodyclose
    # errorlint prefers errors.Is/As over == and type assertions. The domain is
    # built on sentinel errors (oauth.ErrClientNotFound, tap signs.ErrInvalidCredential,
    # federation's revocation outcomes), so a bare == silently stops matching the
    # day one of them is wrapped.
    - errorlint
    # misspell catches typos in comments and literals.
    - misspell
    # nilerr catches `if err != nil { return nil }` — an error swallowed on the
    # way out, which in a fail-closed service is the exact failure that must not
    # be silent.
    - nilerr
    # nolintlint keeps the escape hatch honest: a //nolint must name the linter
    # it silences and say why, so it cannot become a blanket amnesty.
    - nolintlint
    # unconvert catches conversions of a value to its own type, which are usually
    # a sign of a half-finished refactor.
    - unconvert
    # gosec runs with its full default rule set. It used to be "curated" through
    # `gosec.includes`, but in golangci-lint v2 that knob is an allowlist
    # (`rules.NewRuleFilter(false, includes...)`): listing five rules does not
    # select those five, it silently switches off every rule not named — G112,
    # G114 and G115 among them, which is precisely the server-hardening and
    # overflow surface this service's threat model names. The shape is now
    # default-on plus a short, documented `gosec.excludes` below, so every rule
    # keeps running and each accepted finding is named once, with its reason,
    # rather than being invisible in a filter. A production site that trips a
    # rule not excluded below carries a //nolint naming gosec and saying why.
    # (Z16-2, docs/issues/P2-medium.md)
    - gosec

  settings:
    gosec:
      # `excludes` is the visible half of what `includes` only appeared to do.
      # An allowlist makes the gate look curated while silently disabling every
      # rule it omits; an exclusion list runs everything and documents the few
      # findings the project accepts. Each entry here is a deliberate choice,
      # with the reason stated at the entry.
      excludes:
        # G101 (hardcoded credentials) fires on the public OAuth endpoint and
        # JWKS URLs in provider metadata (idp/idp.go, oidchttp/oidchttp.go) and
        # on test fixtures, not on secrets; gitleaks scans the tree and its
        # history for the real thing.
        - G101
        # G505 (crypto/sha1) is the MAC TapTap's built-in-account protocol
        # specifies: HMAC-SHA1 is not ours to change (taptapoauth/client.go).
        - G505

  exclusions:
    generated: lax
    rules:
      # Tests ignore Close errors on httptest response bodies as a matter of
      # course; flagging every `defer resp.Body.Close()` in a fixture buries the
      # findings that matter. Production code is still held to errcheck.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
      # gosec's G304 flags any os.ReadFile of a variable; in a test that is a
      # fixture path the test built itself. The one production read (config.Read)
      # is annotated where it appears.
      - path: _test\.go
        linters:
          - gosec
        text: G304
      # gosec's G104 is errcheck's finding under a security-linter name, and
      # tests are already exempt from errcheck and bodyclose above: a fixture
      # that ignores a Close error to stay readable is the same judgement, made
      # once. The entry is scoped to _test\.go, so production still answers to
      # G104 (and to errcheck) for every unhandled error.
      - path: _test\.go
        linters:
          - gosec
        text: G104
