# TapTap built-in-account (LeanCloud / TDS) profiles.
#
# The app id and app key are embedded in the public game client and are not
# cryptographic secrets; they are kept out of source so a deployment can select
# a profile. The session token IS a secret: never put one in a committed file.

[taptap.cn]
# Used by upstream/tapsign (session-token lifecycle).
leancloud_base_url = "https://rak3ffdi.cloud.tds1.tapapis.cn/1.1"
leancloud_app_id   = "<leancloud-app-id>"
leancloud_app_key  = "<leancloud-app-key>"

# Reserved for the enrollment / login flow (RFC 8628 device authorization);
# not used by upstream/tapsign yet.
device_code_endpoint = "https://www.taptap.com/oauth2/v1/device/code"
token_endpoint       = "https://www.taptap.cn/oauth2/v1/token"
user_info_endpoint   = "https://open.tapapis.cn/account/basic-info/v1"

[taptap.global]
leancloud_base_url = "https://kviehlel.cloud.ap-sg.tapapis.com/1.1"
leancloud_app_id   = "<leancloud-app-id>"
leancloud_app_key  = "<leancloud-app-key>"

device_code_endpoint = "https://www.taptap.io/oauth2/v1/device/code"
token_endpoint       = "https://www.taptap.io/oauth2/v1/token"
user_info_endpoint   = "https://open.tapapis.io/account/basic-info/v1"
