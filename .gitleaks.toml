# Gitleaks configuration.
#
# The default ruleset is extended, not replaced: this file adds only what the
# default gets wrong for this repository. An allowlist that is broad enough to be
# convenient is an allowlist that stops catching things, so the exemption below
# is scoped as tightly as the false positive it exists to silence.

title = "r0semi / Re0Auth"

[extend]
useDefault = true

# The adversarial audit reports quote the output of failing tests as evidence —
# full JSON token responses, so a reader can see what the hole actually produced.
# Those tokens came from a throwaway local run and were never valid anywhere, but
# the default generic-api-key rule reads their entropy as a secret. Only the audit
# reports are exempt; every other path stays under the full ruleset.
#
# `paths` entries are regexes matched anywhere in the path, so the pattern is
# anchored to the exact report names: an unanchored `docs/security-audit-\d+\.md`
# would also exempt `docs/security-audit-7.md.bak`, a backup of that file, or
# anything nested under a directory of that name.
[[allowlists]]
description = "Proof-of-concept output quoted in the adversarial audit reports"
paths = ['''^docs/security-audit-[0-9]+\.md$''']

# The same exemption, for the fifth-round audit's artifacts that quote failing-test
# output and carry fixture strings: three findings reports and one probe script.
# Named individually rather than by directory, for the reason above — a
# directory-wide exemption would also silence the next real finding in it.
[[allowlists]]
description = "Proof-of-concept output quoted in the fifth-round audit's artifacts"
paths = [
  '''docs/audit-5/findings/_fragment_kit\.md''',
  '''docs/audit-5/findings/http-edge\.md''',
  '''docs/audit-5/findings/protocol\.md''',
  '''docs/audit-5/probes/verify-web/bundle-verify\.mjs''',
]

# The seventh-round audit's raw probe log, same rationale: it quotes the failing
# tests' token responses verbatim. Named by file, not by directory.
[[allowlists]]
description = "Proof-of-concept token output quoted in the seventh-round audit log"
paths = ['''docs/audit-7/audit5-red\.log''']

# One probe registers throwaway clients whose secrets are literal fixtures, never
# credentials in any deployment. The exemption needs BOTH the exact file and the
# fixture-secret shape (condition = "AND"): a genuine key in that file, or these
# strings anywhere else, still reports.
[[allowlists]]
description = "Throwaway client-secret fixtures in the audit-6 protocol-token probe"
condition = "AND"
paths = ['''internal/zzprobe/audit6/z02protocoltoken/fixture_test\.go''']
regexes = ['''z02-(web|narrow)-secret''']
