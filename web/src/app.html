<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="referrer" content="no-referrer" />
		<!--
			The consent and device screens are the pages an attacker would most like
			to reproduce convincingly, so the app does not pretend to be a generic
			sign-in page: it is plainly branded, and its own CSP forbids framing.
			See web/vite.config.ts (kit.csp) and internal/webui (frame-ancestors).
		-->
		<title>Re0Auth</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
